[package]
name = "saturn"
edition = "2021"
version = "0.1.0"

[[bin]]
name = "saturn"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
stnx = { path = "../stnx" }

[dev-dependencies]
tempfile = "3"
